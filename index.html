<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPA — Afspraken</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f0ea;color:#342c27}
header{padding:42px 20px;text-align:center;background:#d9c7b7}h1{margin:0;font-size:48px;letter-spacing:8px}
header p{margin:10px 0 0}main{max-width:760px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 6px 20px #0001}
label{display:block;margin:14px 0 6px;font-weight:bold}input,select,button{width:100%;padding:12px;border:1px solid #cfc5bd;border-radius:10px;font-size:16px}
button{margin-top:18px;background:#6f5b4d;color:#fff;border:0;cursor:pointer}.hidden{display:none}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#eee5dc}.appt{padding:14px;border:1px solid #ddd0c5;border-radius:10px;margin:10px 0}
.small{font-size:13px;color:#6d625b}
</style>
</head>
<body>
<header><h1>SPA</h1><p>Online afspraken • Doha &amp; Zoubayr</p></header>
<main>
<section class="card">
<h2>Afspraak aanvragen</h2>
<label>Naam</label><input id="name" placeholder="Jouw naam">
<label>Behandeling</label><select id="service"><option>Massage</option><option>Gezichtsbehandeling</option></select>
<label>Datum</label><input id="date" type="date">
<label>Tijd</label><input id="time" type="time">
<button onclick="requestAppointment()">Aanvraag versturen</button>
<div id="msg"></div>
</section>

<section class="card">
<h2>Beheer</h2>
<p class="small">Alleen Doha &amp; Zoubayr kunnen de afspraken bekijken.</p>
<input id="code" type="password" placeholder="Beheerderscode">
<button onclick="showAppointments()">Afspraken bekijken</button>
<div id="list"></div>
</section>
</main>
<script>
const API_URL="PLAK_HIER_JOUW_GOOGLE_APPS_SCRIPT_URL";

async function requestAppointment(){
 const n=name.value.trim();
 if(!n||!date.value||!time.value){msg.innerHTML='<div class="msg">Vul je naam, datum en tijd in.</div>';return}
 if(API_URL.startsWith("PLAK_")){msg.innerHTML='<div class="msg">De online koppeling moet nog één keer worden ingesteld.</div>';return}
 const body=new URLSearchParams({action:"add",name:n,service:service.value,date:date.value,time:time.value});
 try{await fetch(API_URL,{method:"POST",body});msg.innerHTML='<div class="msg">Je aanvraag is verstuurd.</div>'}
 catch(e){msg.innerHTML='<div class="msg">Er ging iets mis. Probeer opnieuw.</div>'}
}
async function showAppointments(){
 if(code.value!=="1216"){list.innerHTML='<div class="msg">Alleen Doha & Zoubayr hebben toegang.</div>';return}
 if(API_URL.startsWith("PLAK_")){list.innerHTML='<div class="msg">De online koppeling moet nog één keer worden ingesteld.</div>';return}
 try{
  const r=await fetch(API_URL+"?action=list&code=1216"); const d=await r.json();
  if(!d.ok){list.innerHTML='<div class="msg">Geen toegang.</div>';return}
  list.innerHTML=d.appointments.length?d.appointments.map(a=>`<div class="appt"><b>${esc(a.name)}</b> — ${esc(a.service)}<br>${esc(a.date)} om ${esc(a.time)}<br>Status: <b>${esc(a.status)}</b>${a.status==="Aangevraagd"?`<button onclick="approve('${a.id}')">Goedkeuren</button>`:""}</div>`).join(""):"<p>Nog geen afspraken.</p>"
 }catch(e){list.innerHTML='<div class="msg">Afspraken konden niet worden geladen.</div>'}
}
async function approve(id){
 const body=new URLSearchParams({action:"approve",id,code:"1216"});
 await fetch(API_URL,{method:"POST",body}); showAppointments();
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
</script>
</body></html>
